<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
  }

  .bubble {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    max-width: 85%;
    line-height: 1.7;
    font-size: 0.95em;
    color: #333;
  }

  .bot { margin-right: auto; }
  .user { margin-left: auto; background: #e8e8e8; }

  .gap {
    color: #bbb;
    font-size: 0.9em;
    margin-bottom: 16px;
    padding-left: 4px;
  }

  #input-area {
    padding: 16px;
    background: white;
    border-top: 1px solid #eee;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  #msg {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 24px;
    font-size: 0.95em;
    outline: none;
    color: #333;
  }

  #msg::placeholder { color: #bbb; }

  #send {
    padding: 12px 20px;
    background: #555;
    color: white;
    border: none;
    border-radius: 24px;
    font-size: 0.95em;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="chat">
  <div class="bubble bot">こんにちは。ひいろです。あなたの声かけを待っています。</div>
</div>

<div id="input-area">
  <input id="msg" placeholder="ここに声をおいてみる。" />
  <button id="send" onclick="send()">送る</button>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzYhiLeKypcDCMsd-jKL3Xd8hLISOojMjrsRoj6dFzQ_dfelpyOq03Z9RTeYKAgfFQyfA/exec";

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = 'bubble ' + type;
  div.innerText = text;
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = 999999;
}

async function send() {
  const input = document.getElementById('msg');
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  input.value = '';

  const gap = document.createElement('div');
  gap.className = 'gap';
  gap.innerText = '……';
  document.getElementById('chat').appendChild(gap);

  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({
        text: text,
        sessionId: "session_" + Date.now()
      })
    });
    const data = await res.json();
    gap.remove();
    addMessage(data.reply, 'bot');
  } catch(err) {
    gap.remove();
    addMessage('……', 'bot');
  }
}

document.getElementById('msg').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
