// ── タイプ判定ロジック ────────────────────────────
function judgeType(answers) {
  const count = { 共感: 0, 構造: 0, 支援: 0, 観察: 0 };
  answers.forEach(a => {
    const category = SCORE_MAP[a];
    if (category) count[category]++;
  });

  const 共感 = count["共感"];
  const 構造 = count["構造"];
  const 支援 = count["支援"];
  const 観察 = count["観察"];

  // 複合判定（共感+構造 → ナビゲーター / 観察+構造 → フラクタル）
  if (共感 >= 3 && 構造 >= 3) return "navigator";
  if (観察 >= 3 && 構造 >= 3) return "fractal";

  // 最多判定
  const max = Math.max(共感, 構造, 支援, 観察);
  if (共感 === max) return "mirror";
  if (支援 === max) return "caretaker";
  if (構造 === max) return "organizer";
  if (観察 === max) return "observer";
  return "observer";
}

const OVERLOAD_WORDS  = ["消えたい","死にたい","もう無理","限界","パニック","怖い","助けて","爆発しそう","呼吸できない","頭が真っ白"];
const FLASHBACK_WORDS = ["思い出す","フラッシュ","また来た","止まらない","過去","あのとき"];
const ANXIOUS_WORDS   = ["してくれない","わかってくれない","嫌われ","捨てられ","伝わらない","誰も","来ない","既読","返信"];
const AVOIDANT_WORDS  = ["まあ","別に","どうせ","仕方ない","関係ない","慣れた","普通に"];

function detectHintStatus(text) {
  if (OVERLOAD_WORDS.some(w => text.includes(w)))  return "overload";
  if (FLASHBACK_WORDS.some(w => text.includes(w))) return "overload";
  if (text.length > 80)                             return "overload";
  const recentTexts = utteranceBuffer.join(" ");
  const anxiousHits = ANXIOUS_WORDS.filter(w => recentTexts.includes(w)).length;
  if (ANXIOUS_WORDS.some(w => text.includes(w)) || anxiousHits >= 2) return "anxious";
  const shortCount = utteranceBuffer.filter(t => t.length <= 12).length;
  if (AVOIDANT_WORDS.some(w => text.includes(w)) || shortCount >= 3) return "avoidant";
  return "normal";
}

function detectInputType(text) {
  if (text.length <= 3 || /^[…。、]+$/.test(text)) return "avoidance_pattern";
  const tokens = text.split(/\s+|、|。/).filter(Boolean);
  for (const token of tokens) {
    if (token.length < 2) continue;
    const count = utteranceBuffer.filter(t => t.includes(token)).length;
    if (count >= 2) return "repeat";
  }
  return "free";
}

function extractConcrete(text) {
  const timeWords   = ["毎日","毎朝","毎晩","ずっと","最近","昨日","今日","先週","去年","あのとき","いつも","何年も","何ヶ月も"];
  const personWords = ["彼","彼女","あの人","上司","親","母","父","友達","同僚","パートナー","子ども","先生"];
  const placeWords  = ["職場","家","学校","会社","あの場所","ここ","そこ"];
  for (const w of [...timeWords, ...personWords, ...placeWords]) {
    if (text.includes(w)) return w;
  }
  return "";
}

}

function lockInput()   { inputEl.disabled = true;  sendBtn.disabled = true; }
function unlockInput() { inputEl.disabled = false; sendBtn.disabled = false; inputEl.focus(); }
function sleep(ms)     { return new Promise(r => setTimeout(r, ms)); }
function scrollBottom() {
  const distFromBottom = document.body.scrollHeight - window.innerHeight - window.scrollY;
  if (distFromBottom < 120) {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }
}
function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")
          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── バブル追加 ────────────────────────────────────
function addHiiroBubble(text) {
  const row = document.createElement("div");
  row.className = "bubble-row hiiro-row fade";
  row.innerHTML = `
    <div class="icon-wrap">
      <div class="icon"><img src="hiiro.png" onerror="this.parentNode.innerText='ひ'"></div>
      <div class="name">ひいろ</div>
    </div>
    <div class="bubble hiiro">${text}</div>`;
  chat.appendChild(row);
  const ts = document.createElement("div");
  ts.className = "time";
  ts.innerText = nowTime();
  chat.appendChild(ts);
  scrollBottom();
}

function addUserBubble(text) {
  const row = document.createElement("div");
  row.className = "bubble-row user-row fade";
  row.innerHTML = `<div class="bubble user">${escHtml(text)}</div>`;
  chat.appendChild(row);
  const ts = document.createElement("div");
  ts.className = "time right";
  ts.innerText = nowTime();
  chat.appendChild(ts);
  scrollBottom();
}

function addDots() {
  const row = document.createElement("div");
  row.className = "bubble-row hiiro-row fade";
  row.id = "dots-row";
  row.innerHTML = `
    <div class="icon-wrap">
      <div class="icon"><img src="hiiro.png" onerror="this.parentNode.innerText='ひ'"></div>
      <div class="name">ひいろ</div>
    </div>
    <div class="bubble hiiro">…</div>`;
  chat.appendChild(row);
  scrollBottom();
}

function removeDots() {
  const d = document.getElementById("dots-row");
  if (d) d.remove();
}

// ── ボタン表示 ────────────────────────────────────
function showExchangeButtons(buttons) {
  document.querySelectorAll(".exchange-btns").forEach(e => e.remove());
  if (!buttons) return;
  const list = buttons.split(/[|,]/).map(s => s.trim()).filter(Boolean);
  if (!list.length) return;
  const wrap = document.createElement("div");
  wrap.className = "exchange-btns fade";
  list.forEach(label => {
    const btn = document.createElement("button");
    btn.className = "exchange-btn";
    btn.innerText = label;
    btn.onclick = () => {
      wrap.remove();
      sendMessage(label, "button");
    };
    wrap.appendChild(btn);
  });
  chat.appendChild(wrap);
  scrollBottom();
}

// ── CTA表示 ──────────────────────────────────────
async function showCTA(lpUrl, ctaText) {
  lockInput();
  const url  = lpUrl   || LP_URL;
  const text = ctaText || "➔ そのまま、一緒に";
  await sleep(900);
  // ひいろ吹き出し内にリンクを埋め込む
  const row = document.createElement("div");
  row.className = "bubble-row hiiro-row fade";
  row.innerHTML = `
    <div class="icon-wrap">
      <div class="icon"><img src="hiiro.png" onerror="this.parentNode.innerText='ひ'"></div>
      <div class="name">ひいろ</div>
    </div>
    <div class="bubble hiiro">今日話してくれてありがとうございます。<br>その感じ、もう少し一緒に観てみませんか。<br><br><a href="${url}" target="_blank" style="color:#7d5f58;border-bottom:1px solid #cdb8b1;text-decoration:none;font-size:14px;">${text}</a></div>`;
  chat.appendChild(row);
  const ts = document.createElement("div");
  ts.className = "time";
  ts.innerText = nowTime();
  chat.appendChild(ts);
  scrollBottom();
}

// ── 診断結果カード表示 ────────────────────────────
async function showDiagnosisResult(type) {
  const data = TYPE_DATA[type] || TYPE_DATA["observer"];
  await sleep(1000);

  // ① アイコン画像（吹き出しの外、ひいろ側）
  const imgWrap = document.createElement("div");
  imgWrap.className = "bubble-row hiiro-row fade";
  imgWrap.innerHTML = `
    <div class="icon-wrap">
      <div class="icon"><img src="hiiro.png" onerror="this.parentNode.innerText='ひ'"></div>
      <div class="name">ひいろ</div>
    </div>
    <img class="diagnosis-icon" src="${data.icon}" alt="${data.name}" onerror="this.style.display='none'">
  `;
  chat.appendChild(imgWrap);
  scrollBottom();

  await sleep(600);

  // ② タイプ名・キーワード・サマリーをひいろ吹き出し
  addHiiroBubble(`<strong>${data.name}</strong><br><span style="font-size:11px;color:#b8a49e;">${data.keywords}</span><br><br>${escHtml(data.summary).replace(/\n/g,"<br>")}`);

  await sleep(1000);

  // ③ 詳細テキストをひいろ吹き出し
  addHiiroBubble(escHtml(data.detail).replace(/\n/g,"<br>"));

  const ts = document.createElement("div");
  ts.className = "time";
  ts.innerText = nowTime();
  chat.appendChild(ts);
  scrollBottom();

  // 診断後 → sessionへの橋渡し
  await sleep(1200);
  addHiiroBubble("もう少し、一緒に見てみませんか。");
  await sleep(800);
  showExchangeButtons("YES|NO");
  currentModule = "session_offer";
  unlockInput();
}

// ── 診断：1問表示 ─────────────────────────────────
async function showDiagnosisQuestion(step) {
  const q = DIAGNOSIS_QUESTIONS[step];
  addDots();
  await sleep(1200);
  removeDots();
  addHiiroBubble(escHtml(q.q).replace(/\n/g, "<br>"));
  await sleep(400);

  // A/B/C/Dラベルで表示
  const labels = ["A", "B", "C", "D"];
  const wrap = document.createElement("div");
  wrap.className = "exchange-btns fade";
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "exchange-btn";
    btn.innerText = opt;
    btn.dataset.answer = labels[i];
    btn.onclick = () => {
      wrap.remove();
      addUserBubble(opt);
      diagAnswers.push(labels[i]);
      diagStep++;

      if (diagStep < DIAGNOSIS_QUESTIONS.length) {
        showDiagnosisQuestion(diagStep);
      } else {
        // 全問完了 → 判定
        finalizeDiagnosis();
      }
    };
    wrap.appendChild(btn);
  });
  chat.appendChild(wrap);
  scrollBottom();
}

// ── 診断完了 ─────────────────────────────────────
async function finalizeDiagnosis() {
  inDiagnosis = false;
  const type = judgeType(diagAnswers);

  addDots();
  await sleep(1800);
  removeDots();
  addHiiroBubble("…少し、見えてきたかもしれない。");

  // GASへ記録送信（スタンドアロン）
  try {
    await fetch(GAS_URL, {
      method:  "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        userId,
        module:    "diagnosis_result",
        input_type: "diagnosis",
        answers:   diagAnswers,
        type:      type
      })
    });
  } catch(e) { /* 記録失敗は無視 */ }

  await showDiagnosisResult(type);
}

// ── 診断イントロ ─────────────────────────────────
async function startDiagnosisIntro() {
  addDots();
  await sleep(1000);
  removeDots();
  addHiiroBubble("よかったら、あなたの「感じ方」<br>今一緒に見てみませんか？");
  await sleep(500);
  showExchangeButtons("YES|NO");
  currentModule = "diagnosis_intro";
  unlockInput();
}

// ── モード選択 ────────────────────────────────────
async function selectMode(selected) {
  document.getElementById("menu").style.display = "none";
  phase = "loop";
  mode  = selected;
  addUserBubble(selected);
  lockInput();
  await sleep(700);
  addHiiroBubble(`そっか。<br>${selected}のこと、今どんな感じがありますか？`);
  showExchangeButtons("わからない|なんか違う|もやもや|疲れた|その他");
  unlockInput();
}

// ── 送信ハンドラ ──────────────────────────────────
async function send() {
  if (phase === "select") return;
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  await sendMessage(text, detectInputType(text));
}

// ── GAS通信メイン ─────────────────────────────────
async function sendMessage(text, input_type) {
  document.querySelectorAll(".exchange-btns").forEach(e => e.remove());
  addUserBubble(text);
  pushBuffer(text);
  lockInput();

  // pre → モード選択
  if (phase === "pre") {
    phase = "select";
    await sleep(600);
    document.getElementById("menu").style.display = "flex";
    return;
  }

  // 診断イントロの返答
  if (currentModule === "diagnosis_intro") {
    if (text === "YES") {
      addDots();
      await sleep(700);
      removeDots();
      addHiiroBubble("12の質問に答えていただきます。<br>3〜5分ほどかかります。<br>準備はいいですか？");
      await sleep(400);
      showExchangeButtons("はじめる|あとで");
      currentModule = "diagnosis_ready";
      unlockInput();
    } else {
      // NO → session_offerへ静かにスキップ
      addDots();
      await sleep(1000);
      removeDots();
      addHiiroBubble("…そのままでいいです。");
      await sleep(800);
      currentModule = "session_offer";
      addHiiroBubble("もう少し、一緒に見てみませんか。");
      showExchangeButtons("YES|NO");
      unlockInput();
    }
    return;
  }

  // 診断準備確認
  if (currentModule === "diagnosis_ready") {
    if (text === "はじめる") {
      inDiagnosis = true;
      diagAnswers = [];
      diagStep    = 0;
      currentModule = "diagnosis";
      await showDiagnosisQuestion(0);
    } else {
      // あとで → 静かに終了
      addDots();
      await sleep(700);
      removeDots();
      addHiiroBubble("…そのままでいいです。<br>また気が向いたら。");
      lockInput();
    }
    return;
  }

  // session_offer（診断後 or 診断スキップ後）
  if (currentModule === "session_offer") {
    if (text === "YES") {
      addDots();
      await sleep(1800);
      removeDots();
      await showCTA(LP_URL, "➔ そのまま、一緒に");
    } else {
      addDots();
      await sleep(1000);
      removeDots();
      addHiiroBubble("…そのままでいいです。\nまた気が向いたら。");
      lockInput();
    }
    return;
  }

  // offer_3 → フロント直接ハンドル
  if (currentModule === "offer_3") {
    if (text === "YES") {
      // YES → セッションCTA（従来通り、GASのlp_tableを参照）
      addDots();
      await sleep(900);
      removeDots();
      addHiiroBubble("そのままで来てください。");
      await sleep(900);
      await showCTA(LP_URL, "➔ そのまま、一緒に");
    } else {
      // NO → 診断イントロへ
      addDots();
      await sleep(1200);
      removeDots();
      addHiiroBubble("…もう少し、自分の感じを見てみませんか。");
      await sleep(800);
      await startDiagnosisIntro();
    }
    return;
  }

  // hint_status判定
  const hintStatus = detectHintStatus(text);

  // overload → 身体アンカーのみ
  if (hintStatus === "overload") {
    addDots();
    await sleep(2000);
    removeDots();
    addHiiroBubble("足の裏が、床についている。<br>今、ここにいる。<br><br>吸うよりも、少しだけ長く吐くことに意識を向けてみる。");
    await sleep(2000);
    showExchangeButtons("少し落ち着いた|まだしんどい");
    unlockInput();
    return;
  }

  // catchフェーズのloopCount更新
  if (currentModule === "catch") {
    loopCount++;

    if (loopCount >= 3 && text === "近い") {
      addDots();
      await sleep(1800);
      removeDots();
      addHiiroBubble("…少し、見えてきた感じしない？");
      currentModule = "catch_torque";
      showExchangeButtons("少し|まだ|わからない");
      unlockInput();
      return;
    }

    if (text === "近い" && lastEnergy && loopCount < 3) {
      addDots();
      await sleep(1000);
      removeDots();
      addHiiroBubble(`…${lastEnergy}、か。`);
      await sleep(1200);
      addHiiroBubble("そのとき、体のどこかにある？");
      currentModule = "hiiro";
      showExchangeButtons("胸のあたり|喉のあたり|頭のあたり|わからない");
      unlockInput();
      return;
    }
  }

  // ② 身体の回復
  if (currentModule === "hiiro" && (text === "置いておく" || text === "もう少し見る")) {
    const bodyPart = lastEnergy || "その感じ";
    addDots();
    await sleep(1800);
    removeDots();
    addHiiroBubble(`${bodyPart}、少し変わった感じある？`);
    currentModule = "hiiro_torque";
    showExchangeButtons("少し|あまり|わからない");
    unlockInput();
    return;
  }

  if (currentModule === "hiiro_torque") {
    if (text === "あまり") {
      addDots();
      await sleep(1000);
      removeDots();
      addHiiroBubble("それでいい。そのままで。");
      await sleep(800);
    } else if (text === "わからない") {
      addDots();
      await sleep(1000);
      removeDots();
      addHiiroBubble("わからなくていい。");
      await sleep(800);
    }
    bodyLoop++;
    currentModule = "hiiro_flow";
  }

  // ③ 存在の回復
  if (currentModule === "offer_pre" && text === "近い") {
    addDots();
    await sleep(1800);
    removeDots();
    addHiiroBubble("今、ここにいる感じ、する？");
    currentModule = "offer_existence";
    showExchangeButtons("少し|わからない");
    unlockInput();
    return;
  }

  // offer_existence → 診断イントロへ
  if (currentModule === "offer_existence") {
    await sleep(1800);
    await startDiagnosisIntro();
    return;
  }

  const delay = ["hiiro","hiiro_flow","hiiro_dist","hiiro_dir","hiiro_contour","session","offer","offer_pre"].includes(currentModule) ? 1200 : 700;

  addDots();
  await sleep(delay);

  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), GAS_TIMEOUT);

  try {
    const res = await fetch(GAS_URL, {
      method:  "POST",
      headers: { "Content-Type": "text/plain" },
      body:    JSON.stringify({
        userId, mode, text,
        module:       currentModule,
        currentPhase: currentModule,
        input_type,
        hint_status:  hintStatus,
        loopCount, bodyLoop, lastEnergy
      }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    const data = await res.json();
    currentModule = data.next || currentModule;

    removeDots();
    addHiiroBubble((data.output || "…").replace(/\n/g, "<br>"));

    if (data.next === "lp") {
      await showCTA(data.lp_url, data.cta_text);
    } else if (data.next === "end") {
      lockInput();
    } else {
      showExchangeButtons(data.buttons || "");
      unlockInput();
    }

  } catch (err) {
    clearTimeout(timeoutId);
    removeDots();
    addHiiroBubble("…");
    showExchangeButtons("近い|違う|わからない");
    unlockInput();
  }
}

// ── ウォームアップ ────────────────────────────────
window.addEventListener("load", () => {
  fetch(GAS_URL, {
    method:  "POST",
    headers: { "Content-Type": "text/plain" },
    body:    JSON.stringify({ text: "", module: "warmup", input_type: "warmup" })
  }).catch(() => {});
});

inputEl.addEventListener("keypress", e => {
  if (e.key === "Enter" && !e.shiftKey && !inputEl.disabled) {
    e.preventDefault();
    send();
  }
});
</script>
