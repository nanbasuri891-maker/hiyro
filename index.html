<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひいろ</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  color: #4b403d;
  font-size: 14px;

  /* 背景画像 */
  background: url("bg.png") no-repeat center center fixed;
  background-size: cover;
}

/* 全体 */
#app {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 4px 16px 140px;
}

/* アイコン＋名前 */
.bubble-row {
  display: flex;
  align-items: flex-start;
  margin-bottom: 6px;
}

.bubble-row.hiiro-row { justify-content: flex-start; }
.bubble-row.user-row { justify-content: flex-end; }

/* アイコン */
.icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #efe6e2;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 名前 */
.name {
  font-size: 10px;
  color: #9b8480;
  margin-top: 3px;
  text-align: center;
}

/* アイコン縦構造 */
.icon-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-right: 4px;
}

/* 吹き出し */
.bubble {
  max-width: 75%;
  padding: 8px 12px;
  border-radius: 18px;
  line-height: 1.7;
  font-size: 14px;
  white-space: pre-line;
}

.hiiro {
  background: #ffffff;
  border-bottom-left-radius: 6px;
}

.user {
  background: #ece7e2;
  border-bottom-right-radius: 6px;
}

/* 時間 */
.time {
  font-size: 11px;
  opacity: 0.4;
  margin-bottom: 10px;
}

.time.right {
  text-align: right;
}

/* メニュー */
.menu {
  display: grid;
  grid-template-columns: repeat(2, auto);
  justify-content: flex-start;
  gap: 10px;
  margin: 36px 0 56px;
}

.menu div {
  border: 1px solid #d9c8c2;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 11px;
  background: #fffdfc;
  cursor: pointer;
  transition: 0.25s;
}

.menu div:hover {
  opacity: 0.7;
}

/* 入力 */
.input-wrap {
  position: fixed;
  bottom: 20px;
  left: 0;
  width: 100%;
  padding: 0 16px;
}

.input-inner {
  max-width: 600px;
  margin: 0 auto;
  background: white;
  border-radius: 999px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}

textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  font-size: 14px;
  line-height: 1.8;
  height: 24px;
}

button {
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 999px;
  background: #e7c8c1;
  color: white;
  cursor: pointer;
}

/* アニメ */
.fade {
  animation: fade 1s ease;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.spacer { height: 100px; }

</style>
</head>

<body>

<div id="app">

  <!-- ひいろ初期 -->
  <div class="bubble-row hiiro-row fade">
    <div class="icon-wrap">
      <div class="icon">
        <img src="hiiro.png" onerror="this.parentNode.innerText='ひ'">
      </div>
      <div class="name">ひいろ</div>
    </div>

    <div class="bubble hiiro">
こんにちは  
どんなお話しましょうか
    </div>
  </div>

  <!-- メニュー -->
  <div class="menu" id="menu" style="display:none;">
    <div onclick="selectMode('仕事')">仕事</div>
    <div onclick="selectMode('恋愛')">恋愛</div>
    <div onclick="selectMode('人間関係')">人間関係</div>
    <div onclick="selectMode('その他')">その他</div>
    <div onclick="selectMode('イベント')">イベント</div>
    <div onclick="selectMode('雑談')">雑談</div>
  </div>

  <div id="chat"></div>
  <div class="spacer"></div>

</div>

<!-- 入力 -->
<div class="input-wrap">
  <div class="input-inner">
    <textarea id="input" placeholder="..."></textarea>
    <button id="send-btn" onclick="send()">➤</button>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbymH7fuEgaBSsRJTAn9kieFPg3OwMurZQrJF-TB2TH7GUlLfxT__N8e1AnT0-gzq1F85w/exec";
const LP_URL = "https://fractalhistyle.wixsite.com/my-site-2";
const GAS_TIMEOUT_MS = 15000;

const inputEl  = document.getElementById("input");
const sendBtn  = document.getElementById("send-btn");

let mode = "";
let phase = 'pre';

function nowTime(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function lockInput(){
  inputEl.disabled = true;
  sendBtn.disabled = true;
}

function unlockInput(){
  inputEl.disabled = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

function selectMode(selected){
  mode = selected;
  document.getElementById("menu").style.display = "none";
  phase = 'loop';

  addUserBubble(selected);

  setTimeout(() => {
    addHiiroBubble(`そっか<br>${selected}の中で、今ちょっと気になってる感じってありますか`);
    unlockInput();
  }, 700);
}

function addUserBubble(text){
  const chat = document.getElementById("chat");

  chat.innerHTML += `
    <div class="bubble-row user-row fade">
      <div class="bubble user">${escapeHtml(text)}</div>
    </div>
    <div class="time right">${nowTime()}</div>`;

  window.scrollTo(0, document.body.scrollHeight);
}

function addHiiroBubble(text){
  const chat = document.getElementById("chat");

  chat.innerHTML += `
    <div class="bubble-row hiiro-row fade">
      <div class="icon-wrap">
        <div class="icon">
          <img src="hiiro.png" onerror="this.parentNode.innerText='ひ'">
        </div>
        <div class="name">ひいろ</div>
      </div>

      <div class="bubble hiiro">${text}</div>
    </div>

    <div class="time">${nowTime()}</div>`;

  window.scrollTo(0, document.body.scrollHeight);
}

async function send(){

  if(phase === 'select') return;

  const text = inputEl.value.trim();

  if(!text) return;

  addUserBubble(text);

  inputEl.value = "";

  lockInput();

  if(phase === 'pre'){

    phase = 'select';

    setTimeout(() => {

      addHiiroBubble("ありがとう。今日は何はなす？");

      document.getElementById("menu").style.display = "grid";

    }, 800);

    return;
  }

  const controller = new AbortController();

  const timeoutId = setTimeout(() => controller.abort(), GAS_TIMEOUT_MS);

  try{

    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ mode, text }),
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    const data = await res.json();

    setTimeout(() => {

      addHiiroBubble(data.output || "……");

      if(data.next === "lp"){

        setTimeout(() => {

          addHiiroBubble(
            `少し、そのまま一緒に見てみませんか。<br>
            <a href="${LP_URL}" target="_blank"
            style="color:#7d5f58;border-bottom:1px solid #cdb8b1;text-decoration:none;">
            見てみる
            </a>`
          );

        }, 1500);

      } else {

        unlockInput();

      }

    }, 1200);

  } catch(e) {

    clearTimeout(timeoutId);

    setTimeout(() => {

      addHiiroBubble("……");

      unlockInput();

    }, 1200);
  }
}

function escapeHtml(str){
  return str.replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
}

inputEl.addEventListener("keypress", (e) => {

  if(e.key === "Enter" && !e.shiftKey && !inputEl.disabled){

    e.preventDefault();

    send();
  }
});
</script>

</body>
</html>
