<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひいろ</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  color: #4b403d;
  font-size: 14px;

  /* 背景画像 */
  background: url("bg.png") no-repeat center center fixed;
  background-size: cover;
}

/* 全体 */
#app {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 4px 16px 140px;
}

/* アイコン＋名前 */
.bubble-row {
  display: flex;
  align-items: flex-end;
  margin-bottom: 6px;
}

.bubble-row.hiiro-row { justify-content: flex-start; }
.bubble-row.user-row { justify-content: flex-end; }

/* アイコン */
.icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #efe6e2;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 名前 */
.name {
  font-size: 11px;
  color: #9b8480;
  margin-top: 4px;
  text-align: center;
}

/* アイコン縦構造 */
.icon-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-right: 8px;
}

/* 吹き出し */
.bubble {
  max-width: 60%;
  padding: 8px 14px;
  border-radius: 16px;
  line-height: 1.55;
  font-size: 14px;
  white-space: pre-line;
}

.hiiro {
  background: #ffffff;
  border-bottom-left-radius: 6px;
}

.user {
  background: #ece7e2;
  border-bottom-right-radius: 6px;
}

/* 時間 */
.time {
  font-size: 11px;
  opacity: 0.4;
  margin-bottom: 10px;
}

.time.right {
  text-align: right;
}

/* メニュー */
.menu {
  display: grid;
  grid-template-columns: repeat(2, auto);
  justify-content: flex-start;
  gap: 10px;
  margin: 36px 0 56px;
}

.menu div {
  border: 1px solid #d9c8c2;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 11px;
  background: #fffdfc;
  cursor: pointer;
  transition: 0.25s;
}

.menu div:hover {
  opacity: 0.7;
}

/* 入力 */
.input-wrap {
  position: fixed;
  bottom: 20px;
  left: 0;
  width: 100%;
  padding: 0 16px;
}

.input-inner {
  max-width: 600px;
  margin: 0 auto;
  background: white;
  border-radius: 999px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}

textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  font-size: 14px;
  line-height: 1.8;
  height: 24px;
}

button {
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 999px;
  background: #e7c8c1;
  color: white;
  cursor: pointer;
}

/* アニメ */
.fade {
  animation: fade 1s ease;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.spacer { height: 100px; }

/* 交換ボタン */
.exchange-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 12px 52px;
}
.exchange-btn {
  border: 1px solid #d9c8c2;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 12px;
  background: #fffdfc;
  color: #4b403d;
  cursor: pointer;
  transition: 0.2s;
  font-family: inherit;
  white-space: nowrap;
}
.exchange-btn:hover { opacity: 0.7; }

</style>
</head>

<body>

<div id="app">

  <!-- ひいろ初期 -->
  <div class="bubble-row hiiro-row fade">
    <div class="icon-wrap">
      <div class="icon">
        <img src="hiiro.png" onerror="this.parentNode.innerText='ひ'">
      </div>
      <div class="name">ひいろ</div>
    </div>

    <div class="bubble hiiro">こんにちは
どんなお話しましょうか</div>
  </div>

  <!-- メニュー -->
  <div class="menu" id="menu" style="display:none;">
    <div onclick="selectMode('仕事')">仕事</div>
    <div onclick="selectMode('恋愛')">恋愛</div>
    <div onclick="selectMode('人間関係')">人間関係</div>
    <div onclick="selectMode('その他')">その他</div>
    <div onclick="selectMode('イベント')">イベント</div>
    <div onclick="selectMode('雑談')">雑談</div>
  </div>

  <div id="chat"></div>
  <div class="spacer"></div>

</div>

<!-- 入力 -->
<div class="input-wrap">
  <div class="input-inner">
    <textarea id="input" placeholder="..."></textarea>
    <button id="send-btn" onclick="send()">➤</button>
  </div>
</div>

<script>
const GAS_URL        = "https://script.google.com/macros/s/AKfycbznqcOFWAzTpEUjUbAxLL2pHaADEv9mEBIWfaJhgHPRyjMKgUyqqx0SkKku9Ljb5Vzf/exec";
const LP_URL         = "https://fractalhistyle.wixsite.com/my-site-2";
const GAS_TIMEOUT_MS = 15000;

const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");

let mode          = "";
let currentModule = "catch";
let phase         = "pre";

// ── userId：ブラウザごとに固定（LocalStorage）────────────────
let userId = localStorage.getItem("hiiro_userId");
if (!userId) {
  userId = "u_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  localStorage.setItem("hiiro_userId", userId);
}

// ── ユーティリティ ────────────────────────────────────────────
function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
}

function lockInput() {
  inputEl.disabled = true;
  sendBtn.disabled = true;
}
function unlockInput() {
  inputEl.disabled = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

function escapeHtml(str) {
  return str
    .replace(/&/g,  "&amp;")
    .replace(/</g,  "&lt;")
    .replace(/>/g,  "&gt;")
    .replace(/"/g,  "&quot;")
    .replace(/'/g,  "&#039;");
}

// ── 選択肢ボタン ──────────────────────────────────────────────
function showExchangeButtons(buttons) {
  if (!buttons) return;
  const list = buttons.split(",").map(s => s.trim()).filter(Boolean);
  if (!list.length) return;

  const wrap = document.createElement("div");
  wrap.className = "exchange-btns";

  list.forEach(label => {
    const btn = document.createElement("button");
    btn.className = "exchange-btn";
    btn.innerText = label;
    btn.onclick = () => {
      wrap.remove();
      sendMessage(label, "button");
    };
    wrap.appendChild(btn);
  });

  document.getElementById("chat").appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
}

// ── 吹き出し描画 ──────────────────────────────────────────────
function addUserBubble(text) {
  const chat = document.getElementById("chat");
  const row  = document.createElement("div");
  row.className = "bubble-row user-row fade";
  row.innerHTML = `<div class="bubble user">${escapeHtml(text)}</div>`;
  chat.appendChild(row);
  const time = document.createElement("div");
  time.className = "time right";
  time.innerText = nowTime();
  chat.appendChild(time);
  window.scrollTo(0, document.body.scrollHeight);
}

function addHiiroBubble(text) {
  const chat = document.getElementById("chat");
  const row  = document.createElement("div");
  row.className = "bubble-row hiiro-row fade";
  row.innerHTML = `
    <div class="icon-wrap">
      <div class="icon"><img src="hiiro.png" onerror="this.parentNode.innerText='ひ'"></div>
      <div class="name">ひいろ</div>
    </div>
    <div class="bubble hiiro">${text}</div>`;
  chat.appendChild(row);
  const time = document.createElement("div");
  time.className = "time";
  time.innerText = nowTime();
  chat.appendChild(time);
  window.scrollTo(0, document.body.scrollHeight);
}

// ── モード選択 ────────────────────────────────────────────────
function selectMode(selected) {
  mode = selected;
  document.getElementById("menu").style.display = "none";
  phase = "loop";
  addUserBubble(selected);
  setTimeout(() => {
    addHiiroBubble(`そっか<br>${selected}の中で、今ちょっと気になってる感じってありますか`);
    showExchangeButtons("わからない,なんか違う,もやもや,疲れた,その他");
    unlockInput();
  }, 700);
}

// ── 送信エントリ ──────────────────────────────────────────────
async function send() {
  if (phase === "select") return;
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  await sendMessage(text, "free");
}

// ── GAS通信（配管の中核）─────────────────────────────────────
async function sendMessage(text, input_type) {
  document.querySelectorAll(".exchange-btns").forEach(el => el.remove());

  addUserBubble(text);
  lockInput();

  // pre フェーズ：テキスト入力でメニューを出す
  if (phase === "pre") {
    phase = "select";
    setTimeout(() => {
      document.getElementById("menu").style.display = "grid";
    }, 800);
    return;
  }

  // … 吹き出し（通信中：ひいろが言葉を受け止めている気配）
  const dotsRow = document.createElement("div");
  dotsRow.className = "bubble-row hiiro-row fade";
  dotsRow.innerHTML = `
    <div class="icon-wrap">
      <div class="icon"><img src="hiiro.png" onerror="this.parentNode.innerText='ひ'"></div>
      <div class="name">ひいろ</div>
    </div>
    <div class="bubble hiiro" id="dots-bubble">…</div>`;
  document.getElementById("chat").appendChild(dotsRow);
  window.scrollTo(0, document.body.scrollHeight);

  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), GAS_TIMEOUT_MS);

  try {
    const res = await fetch(GAS_URL, {
      method : "POST",
      body   : JSON.stringify({
        userId,                        // ← LocalStorage から引き継ぐ識別子
        module     : currentModule,    // GAS側で currentPhase として受け取る
        text,
        input_type
      }),
      signal : controller.signal
    });
    clearTimeout(timeoutId);

    const data    = await res.json();
    currentModule = data.next || currentModule;

    // … を消してひいろの言葉を流し込む
    dotsRow.remove();
    addHiiroBubble(data.output || "……");

    if (data.next === "lp") {
      // LPへのCTA（既存仕様どおり）
      setTimeout(() => {
        addHiiroBubble(
          `少し、そのまま一緒に見てみませんか。<br><a href="${LP_URL}" target="_blank" style="color:#7d5f58;border-bottom:1px solid #cdb8b1;text-decoration:none;">見てみる</a>`
        );
      }, 1500);
    } else {
      showExchangeButtons(data.buttons);
      unlockInput();
    }

  } catch (e) {
    clearTimeout(timeoutId);
    dotsRow.remove();
    addHiiroBubble("……");
    unlockInput();
  }
}

// ── ウォームアップ（コールドスタート対策）────────────────────
window.addEventListener("load", () => {
  fetch(GAS_URL, {
    method : "POST",
    body   : JSON.stringify({ userId, text: "", module: "warmup", input_type: "warmup" })
  }).catch(() => {});
});

// ── Enterキー送信 ─────────────────────────────────────────────
inputEl.addEventListener("keypress", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !inputEl.disabled) {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
