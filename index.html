<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>hiiro</title>
</head>

<body>

<div id="chat"></div>

<!-- ■ 初期表示（プレひいろ） -->
<div id="start">
  <div>ありがとうございます。今日は何をはなしましょうか？</div>

  <button onclick="selectMode('仕事')">仕事</button>
  <button onclick="selectMode('恋愛')">恋愛</button>
  <button onclick="selectMode('人間関係')">人間関係</button>
  <button onclick="selectMode('その他')">その他</button>
  <button onclick="selectMode('イベント')">イベント</button>
  <button onclick="selectMode('雑談')">雑談</button>
</div>

<!-- ■ 入力 -->
<div>
  <input id="input" placeholder="ここに入力">
  <button onclick="send()">送信</button>
</div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycby_MUK56p7XzqsTsQYx9snbS3TqcEFB5LrjT_rQFSalmET6Eb8ZQwm1jzEwZj1yG2qYXA/exec";
let mode = "";

function selectMode(m) {
  mode = m;
  document.getElementById("chat").innerHTML += `<div>（${m}で開始）</div>`;
}

async function send() {

  const text = document.getElementById("input").value;

  const res = await fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({
      text: text,
      mode: mode
    })
  });

  const data = await res.json();

  render(data.output);

}

function render(msg) {
  const div = document.createElement("div");
  div.innerHTML = msg;
  document.getElementById("chat").appendChild(div);
}

</script>

</body>
</html>
