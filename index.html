<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HIIRO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121214;
      color: #e3e3e6;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background-color: #16161a;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
    }

    #chat-timeline {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat-timeline::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }

    .message-row {
      display: flex;
      width: 100%;
      animation: fadeIn 0.3s ease forwards;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.hiiro {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      padding: 14px 18px;
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: 0.03em;
      white-space: pre-wrap;
    }

    .user .bubble {
      background-color: #2a2b36;
      color: #f5f5f7;
      border-radius: 18px 18px 4px 18px;
    }

    .hiiro .bubble {
      background-color: #1c1c24;
      color: #d1d1d6;
      border-radius: 18px 18px 18px 4px;
      border: 1px solid #242430;
    }

    .bubble.connection-prompt {
      background-color: #1a1518;
      border: 1px solid #2c1e23;
      color: #e5c5d0;
      text-align: center;
      width: 100%;
      max-width: 100%;
      border-radius: 12px;
      padding: 16px;
      margin: 10px 0;
    }

    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 8px 4px;
      align-items: center;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background-color: #636366;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    #control-panel {
      padding: 16px 20px 24px 20px;
      background-color: #16161a;
      border-top: 1px solid #1f1f24;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #button-container {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    #button-container.grid-1 {
      grid-template-columns: 1fr;
    }

    #button-container.grid-2 {
      grid-template-columns: 1fr 1fr;
    }

    #button-container.grid-3 {
      grid-template-columns: 1fr 1fr 1fr;
    }

    #button-container.grid-4 {
      grid-template-columns: 1fr 1fr;
    }

    #button-container.grid-multi {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .action-btn {
      background-color: #1c1c24;
      border: 1px solid #2a2a38;
      color: #c7c7cc;

      padding: 12px 10px;
      border-radius: 10px;

      font-size: 13.5px;
      line-height: 1.35;

      cursor: pointer;
      transition: all 0.2s ease;

      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
    }

    .action-btn:active {
      background-color: #2a2b36;
      border-color: #48485a;
      color: #ffffff;
    }

    #input-form {
      display: flex;
      background-color: #1c1c24;
      border: 1px solid #242430;
      border-radius: 24px;
      padding: 4px 6px 4px 16px;
      align-items: center;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #f5f5f7;
      font-size: 15px;
      height: 40px;
      outline: none;
    }

    #user-input::placeholder {
      color: #48484a;
    }

    #send-btn {
      background-color: #2a2b36;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #d1d1d6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    #send-btn:active {
      background-color: #3a3b4c;
      color: #ffffff;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0% {
        opacity: .2;
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: .2;
      }
    }
  </style>
</head>

<body>

<div id="app-container">

  <div id="chat-timeline"></div>

  <div id="control-panel">

    <div id="button-container"></div>

    <form id="input-form" onsubmit="handleFormSubmit(event)">

      <input
        type="text"
        id="user-input"
        placeholder="ここにある感覚を言葉にしてみる"
        autocomplete="off"
      >

      <button type="submit" id="send-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>

    </form>

  </div>

</div>

<script>

  // ==========================================
  // GAS WEBAPP URL
  // ==========================================
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwxaD4ZUuVPzB8eF3rmu8-OrkOmYIsBtE_DFgZM1XSqE35G0kjfZ9mBn7w6L_DZKUWEmA/exec";
  // ==========================================
  // LOCAL STORAGE STATE
  // ==========================================
  let state = {
    userId: localStorage.getItem('userId') || crypto.randomUUID(),
    currentPhase: localStorage.getItem('currentPhase') || 'catch',
    loopCount: 0,
    loopFired: false
  };

  localStorage.setItem('userId', state.userId);
  localStorage.setItem('currentPhase', state.currentPhase);

  // ==========================================
  // BUFFER
  // ==========================================
  const utteranceBuffer = [];

  // ==========================================
  // WORD MAPS
  // ==========================================
  const OVERLOAD_WORDS = [
    '消えたい','もう無理','怖い','震え',
    '息が','真っ白','くるしい','しんどい',
    '死にたい','助けて'
  ];

  const ANXIOUS_WORDS = [
    'してくれない','わかってくれない','ひとり',
    '誰も','伝わらない','嫌われ',
    '見捨て','不安','連絡','返信'
  ];

  const AVOIDANT_WORDS = [
    'まあ','別に','どうせ',
    '仕方ない','大丈夫','関係ない',
    '慣れた','自分でできる',
    '意味ない','ロジック'
  ];

  // ==========================================
  // INITIALIZE
  // ==========================================
  window.addEventListener('DOMContentLoaded', () => {
    executePipeline("…", "free");
  });

  // ==========================================
  // FORM SUBMIT
  // ==========================================
  function handleFormSubmit(event) {

    event.preventDefault();

    const inputEl = document.getElementById('user-input');
    const text = inputEl.value.trim();

    if (!text) return;

    inputEl.value = '';

    appendMessageRow(text, 'user');

    updateUtteranceBuffer(text);

    const analysis = analyzeUtterance(text);

    if (state.currentPhase === 'catch') {
      state.loopCount++;
    }

    executePipeline(
      text,
      analysis.inputType,
      analysis.hintStatus
    );
  }

  // ==========================================
  // BUTTON TAP
  // ==========================================
  function handleButtonTap(buttonText) {

    renderButtons("");

    appendMessageRow(buttonText, 'user');

    updateUtteranceBuffer(buttonText);

    if (state.currentPhase === 'catch') {
      state.loopCount++;
    }

    executePipeline(
      buttonText,
      buttonText,
      "normal"
    );
  }

  // ==========================================
  // BUFFER UPDATE
  // ==========================================
  function updateUtteranceBuffer(text) {

    utteranceBuffer.push({
      text: text,
      charLen: text.length,
      timestamp: Date.now()
    });

    if (utteranceBuffer.length > 5) {
      utteranceBuffer.shift();
    }
  }

  // ==========================================
  // ANALYZE
  // ==========================================
  function analyzeUtterance(text) {

    let hintStatus = "normal";
    let inputType = "free";

    const hasOverloadWord = OVERLOAD_WORDS.some(w => text.includes(w));

    if (hasOverloadWord) {
      hintStatus = "overload";
    }

    const hasAnxiousWord = ANXIOUS_WORDS.some(w => text.includes(w));

    const recentAnxiousCount = utteranceBuffer
      .slice(-3)
      .filter(u => ANXIOUS_WORDS.some(w => u.text.includes(w)))
      .length;

    if (hasAnxiousWord || recentAnxiousCount >= 2) {

      if (hintStatus !== "overload") {
        hintStatus = "anxious";
      }
    }

    const hasAvoidantWord = AVOIDANT_WORDS.some(w => text.includes(w));

    const isConsecutiveShort =
      utteranceBuffer.slice(-3).length >= 3 &&
      utteranceBuffer.slice(-3).every(u => u.charLen <= 15);

    if (
      hasAvoidantWord ||
      (isConsecutiveShort && text.length <= 15)
    ) {

      if (
        hintStatus !== "overload" &&
        hintStatus !== "anxious"
      ) {
        hintStatus = "avoidant";
      }
    }

    if (utteranceBuffer.length >= 3) {

      if (text.length >= 3) {

        let matchCount = 0;

        utteranceBuffer.forEach(u => {
          if (u.text.includes(text.substring(0, 3))) {
            matchCount++;
          }
        });

        if (matchCount >= 3) {
          inputType = "repeat";
        }
      }
    }

    if (
      text === '…' ||
      text === '...' ||
      (
        text.length <= 4 &&
        utteranceBuffer
          .slice(-2)
          .every(u => u.charLen <= 4)
      )
    ) {
      inputType = "avoidance_pattern";
    }

    return {
      hintStatus,
      inputType
    };
  }

  // ==========================================
  // MAIN PIPELINE
  // ==========================================
  function executePipeline(text, inputType, hintStatus = "normal") {

    const timeline = document.getElementById('chat-timeline');

    const indicatorRow = document.createElement('div');

    indicatorRow.className = 'message-row hiiro';

    indicatorRow.innerHTML = `
      <div class="bubble">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    `;

    timeline.appendChild(indicatorRow);

    timeline.scrollTop = timeline.scrollHeight;

    renderButtons("");

    const payload = {
      userId: state.userId,
      currentPhase: state.currentPhase,
      text: text,
      input_type: inputType,
      hint_status: hintStatus
    };

    fetch(GAS_URL, {
      method: 'POST',
      mode: 'cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })

    .then(res => res.json())

    .then(data => {

      indicatorRow.remove();

      appendMessageRow(data.output || "…", 'hiiro');

      state.currentPhase =
        data.next || state.currentPhase;

      localStorage.setItem(
        'currentPhase',
        state.currentPhase
      );

      if (
        state.currentPhase === 'catch' &&
        state.loopCount > 3 &&
        !state.loopFired
      ) {

        state.loopFired = true;

        setTimeout(() => {

          appendMessageRow(
            "もう少し、一緒に見ていけそうですか。",
            'hiiro',
            true
          );

          state.currentPhase = 'session';

          localStorage.setItem(
            'currentPhase',
            state.currentPhase
          );

          renderButtons("はい|まだ少し");

        }, 800);

      } else {

        renderButtons(data.buttons);

      }

    })

    .catch(err => {

      indicatorRow.remove();

      appendMessageRow("…", 'hiiro');

      console.error("Pipeline Error:", err);

    });
  }

  // ==========================================
  // MESSAGE APPEND
  // ==========================================
  function appendMessageRow(
    text,
    side,
    isConnectionPrompt = false
  ) {

    const timeline =
      document.getElementById('chat-timeline');

    const row = document.createElement('div');

    row.className = `message-row ${side}`;

    const bubble = document.createElement('div');

    bubble.className =
      isConnectionPrompt
      ? 'bubble connection-prompt'
      : 'bubble';

    bubble.textContent = text;

    row.appendChild(bubble);

    timeline.appendChild(row);

    timeline.scrollTop = timeline.scrollHeight;
  }

  // ==========================================
  // BUTTON RENDER
  // ==========================================
  function renderButtons(buttonsString) {

    const container =
      document.getElementById('button-container');

    container.innerHTML = '';

    container.classList.remove(
      'grid-1',
      'grid-2',
      'grid-3',
      'grid-4',
      'grid-multi'
    );

    if (!buttonsString) return;

    const btnArray = buttonsString
      .split('|')
      .map(b => b.trim())
      .filter(b => b);

    const count = btnArray.length;

    if (count === 0) return;

    if (count === 1) {
      container.classList.add('grid-1');
    }

    else if (count === 2) {
      container.classList.add('grid-2');
    }

    else if (count === 3) {
      container.classList.add('grid-3');
    }

    else if (count === 4) {
      container.classList.add('grid-4');
    }

    else {
      container.classList.add('grid-multi');
    }

    btnArray.forEach(btnText => {

      const btn = document.createElement('div');

      btn.className = 'action-btn';

      btn.textContent = btnText;

      btn.onclick = () => handleButtonTap(btnText);

      container.appendChild(btn);

    });
  }

</script>

</body>
</html>
