<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひいろ</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  color: #4b403d;
  font-size: 14px;
  /* 背景画像を画面全体に美しく固定 */
  background: url("bg.png") no-repeat center center fixed;
  background-size: cover;
  background-color: #fcf9f7; /* 画像がない場合のフォールバック */
}

/* 全体コンテナ */
#app {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 24px 16px 140px;
  display: flex;
  flex-direction: column;
}

/* タイムライン（メッセージとメニューが正しい順序で並ぶ場所） */
#chat-timeline {
  display: flex;
  flex-direction: column;
  width: 100%;
}

/* 行全体の構造 */
.bubble-row {
  display: flex;
  align-items: flex-start; /* 上揃えにしてLINEらしさを強調 */
  margin-bottom: 4px;
  width: 100%;
}

.bubble-row.hiiro-row { justify-content: flex-start; }
.bubble-row.user-row { justify-content: flex-end; }

/* アイコンと名前 */
.icon-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-right: 10px;
  flex-shrink: 0;
}

.icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #efe6e2;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 14px;
  font-weight: bold;
  color: #9b8480;
}

.icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.name {
  font-size: 10px;
  color: #9b8480;
  margin-top: 4px;
  text-align: center;
}

/* 吹き出しの横幅修正（width: fit-contentがポイントです） */
.bubble {
  max-width: 70%;
  width: fit-content;
  padding: 10px 16px;
  border-radius: 18px;
  line-height: 1.6;
  font-size: 14px;
  white-space: pre-line;
  word-break: break-all;
}

.hiiro {
  background: #f4eaea;
  border-top-left-radius: 4px; /* LINE風の角丸制御 */
}

.user {
  background: #ece7e2;
  border-top-right-radius: 4px;
}

/* 時間表示 */
.time {
  font-size: 10px;
  opacity: 0.5;
  margin-bottom: 16px;
  color: #9b8480;
}
.hiiro-row + .time { margin-left: 50px; text-align: left; } /* アイコンの幅に合わせて調整 */
.user-row + .time { text-align: right; }

/* メニュー（チャットのタイムライン内に自然に差し込まれる） */
.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 280px; /* 横に広がりすぎないサイズ */
  margin: 12px 0 20px 50px; /* ひいろのアイコン幅に合わせる */
}

.menu div {
  border: 1px solid #d9c8c2;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 12px;
  background: rgba(255, 253, 252, 0.9);
  text-align: center;
  cursor: pointer;
  transition: background 0.2s, opacity 0.2s;
  color: #4b403d;
}

.menu div:hover {
  background: #efe6e2;
}

/* 入力エリア固定 */
.input-wrap {
  position: fixed;
  bottom: 20px;
  left: 0;
  width: 100%;
  padding: 0 16px;
  z-index: 100;
}

.input-inner {
  max-width: 600px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(4px);
  border-radius: 999px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  box-shadow: 0 4px 20px rgba(75, 64, 61, 0.1);
}

textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  font-size: 14px;
  line-height: 1.5;
  height: 22px;
  color: #4b403d;
}

button {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: #e7c8c1;
  color: white;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s;
}

button:hover { opacity: 0.9; }

/* フェードインアニメーション */
.fade {
  animation: fade 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.spacer { height: 60px; }
</style>
</head>

<body>

<div id="app">
  <div id="chat-timeline">
    
    <div class="bubble-row hiiro-row fade">
      <div class="icon-wrap">
        <div class="icon">
          <img src="hiiro.png" onerror="this.style.display='none'; this.parentNode.innerText='ひ'">
        </div>
        <div class="name">ひいろ</div>
      </div>
      <div class="bubble hiiro">こんにちは  
どんなお話しましょうか</div>
    </div>
    <div class="time">00:00</div>

  </div>

  <div class="spacer"></div>
</div>

<div class="input-wrap">
  <div class="input-inner">
    <textarea id="input" placeholder="メッセージを入力..."></textarea>
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbw7Nkcqx0Kw8bFo2myd6vVKXdYOdy1d7LQkd3pmpK_q6qzRtW1e481wM_PLMYW8ArlzUg/exec";
const LP_URL = "https://fractalhistyle.wixsite.com/my-site-2";

let mode = "";
let firstInputDone = false;

// 初回メッセージの時刻を設定
document.querySelector('.time').innerText = nowTime();

function nowTime(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function selectMode(selected){
  mode = selected;
  
  // 選択されたらメニューをタイムラインから削除（または非表示）
  const menu = document.getElementById("menu");
  if(menu) menu.remove(); 

  addUserBubble(selected);
  
  setTimeout(() => {
    addHiiroBubble(`…${selected}なんですね。`);
  }, 700);
}

function addUserBubble(text){
  const timeline = document.getElementById("chat-timeline");
  timeline.insertAdjacentHTML('beforeend', `
    <div class="bubble-row user-row fade">
      <div class="bubble user">${escapeHtml(text)}</div>
    </div>
    <div class="time right">${nowTime()}</div>
  `);
  scrollToBottom();
}

function addHiiroBubble(text){
  const timeline = document.getElementById("chat-timeline");
  timeline.insertAdjacentHTML('beforeend', `
    <div class="bubble-row hiiro-row fade">
      <div class="icon-wrap">
        <div class="icon">
          <img src="hiiro.png" onerror="this.style.display='none'; this.parentNode.innerText='ひ'">
        </div>
        <div class="name">ひいろ</div>
      </div>
      <div class="bubble hiiro">${text}</div>
    </div>
    <div class="time">${nowTime()}</div>
  `);
  scrollToBottom();
}

// メニューを動的にタイムラインの「最下部」に追加する関数
function addMenuElement(){
  const timeline = document.getElementById("chat-timeline");
  timeline.insertAdjacentHTML('beforeend', `
    <div class="menu fade" id="menu">
      <div onclick="selectMode('仕事')">仕事</div>
      <div onclick="selectMode('恋愛')">恋愛</div>
      <div onclick="selectMode('人間関係')">人間関係</div>
      <div onclick="selectMode('その他')">その他</div>
      <div onclick="selectMode('イベント')">イベント</div>
      <div onclick="selectMode('雑談')">雑談</div>
    </div>
  `);
  scrollToBottom();
}

function scrollToBottom() {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

async function send(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  addUserBubble(text);
  input.value = "";

  // 初回入力時はトリガーUIの起動のみ（GASへは送らない）
  if(!firstInputDone){
    firstInputDone = true;
    setTimeout(() => {
      addHiiroBubble("ありがとうございます。今日は何はなす？");
      // 応答のあとにメニューを正しく「下に」出す
      setTimeout(() => {
        addMenuElement();
      }, 400);
    }, 800);
    return; 
  }

  // 2回目以降の通常の会話データフロー
  try{
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({ mode, text })
    });

    const data = await res.json();

    setTimeout(() => {
      addHiiroBubble(data.output || "……");

      if(data.next === "lp"){
        setTimeout(() => {
          addHiiroBubble(
            `少し、そのまま一緒に見てみませんか。<br><br>
            <a href="${LP_URL}" target="_blank" style="color:#7d5f58;border-bottom:1px solid #cdb8b1;text-decoration:none;font-weight:bold;">
            見てみる
            </a>`
          );
        }, 1500);
      }
    }, 1200);

  } catch(e) {
    setTimeout(() => addHiiroBubble("……"), 1200);
  }
}

function escapeHtml(str){
  return str.replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
}
</script>

</body>
</html>
