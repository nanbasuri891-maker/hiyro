<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひいろ</title>

<style>
* { 
  box-sizing: border-box; 
}

body {
  margin: 0;
  padding: 0;
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: url('bg.png') no-repeat center center fixed;
  background-size: cover;
  color: #333333;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

#app {
  width: 100%;
  max-width: 480px;
  height: 100vh;
  display: flex;
  flex-content: space-between;
  flex-direction: column;
  padding-top: 4px; /* 上部余白を極限まで詰める調律 */
}

/* チャット表示エリア */
#chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}

/* 共通メッセージ外殻 */
.message-wrapper {
  display: flex;
  width: 100%;
  align-items: flex-start;
  margin-bottom: 4px;
}

/* ひいろ（左側・アイコンあり） */
.message-wrapper.hiiro {
  justify-content: flex-start;
}

.hiiro-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: url('hiiro.png') no-repeat center center;
  background-size: cover;
  margin-right: 10px;
  flex-shrink: 0;
}

.bubble {
  max-width: 70%;
  padding: 12px 16px;
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: 0.02em;
  white-space: pre-wrap;
}

.message-wrapper.hiiro .bubble {
  background-color: #ffffff;
  color: #333333;
  border-radius: 4px 16px 16px 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

/* ユーザー（右側・アイコンなし） */
.message-wrapper.user {
  justify-content: flex-end;
}

.message-wrapper.user .bubble {
  background-color: rgba(255, 255, 255, 0.2);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 16px 4px 16px 16px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

/* 点滅する気配（…）の表現 */
.dots-bubble {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 12px 20px;
}
.dot {
  width: 6px;
  height: 6px;
  background-color: rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  animation: dotBlink 1.4s infinite both;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotBlink {
  0% { opacity: .2; transform: scale(0.8); }
  20% { opacity: 1; transform: scale(1); }
  100% { opacity: .2; transform: scale(0.8); }
}

/* 動的選択肢ボタン：文字が収まり、完全に等比率に並ぶグリッド設計 */
.hiiro-buttons-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 10px;
  margin-top: 6px;
  margin-bottom: 6px;
  width: 100%;
  max-width: 100%;
  animation: fadeInButton 0.4s ease forwards;
}

.hiiro-choice-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 14px;
  background-color: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  color: rgba(255, 255, 255, 0.9);
  font-size: 13px;
  line-height: 1.4;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: all 0.2s ease;
  box-sizing: border-box;
  word-break: break-word; /* ボタン内の文字溢れ・はみ出しを完全に防止 */
  text-align: center;
}

.hiiro-choice-btn:hover {
  background-color: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.3);
  color: #ffffff;
}

@keyframes fadeInButton {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 入力制御エリア */
#input-container {
  padding: 16px;
  display: flex;
  gap: 10px;
  background: transparent;
}

#user-input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 24px;
  background-color: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  font-size: 14px;
  outline: none;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

#user-input::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

#user-input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#send-btn {
  padding: 0 20px;
  border: none;
  border-radius: 24px;
  background-color: rgba(255, 255, 255, 0.9);
  color: #333333;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}

#send-btn:hover {
  background-color: #ffffff;
}

#send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>
</head>
<body>

<div id="app">
  <div id="chat-area"></div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="..." autocomplete="off">
    <button id="send-btn">送信</button>
  </div>
</div>

<script>
// 1. 固有設定と状態管理
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyAyAqLfTdqH9myGphY7Tl9hGiD11oPEIVV_dbxs_wMlDBC_0zixLpz78c2X3HXAkj1iA/exec";

let userId = localStorage.getItem("hiiro_user_id");
if (!userId) {
  userId = "usr_" + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
  localStorage.setItem("hiiro_user_id", userId);
}

let currentPhase = localStorage.getItem("hiiro_current_phase") || "catch";

const chatArea = document.getElementById("chat-area");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");

// 2. 吹き出し描画ヘルパー
function appendHiiroBubble(text) {
  const wrapper = document.createElement("div");
  wrapper.className = "message-wrapper hiiro";
  
  const avatar = document.createElement("div");
  avatar.className = "hiiro-avatar";
  
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatArea.appendChild(wrapper);
  autoScroll();
}

function appendUserBubble(text) {
  const wrapper = document.createElement("div");
  wrapper.className = "message-wrapper user";
  
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  
  wrapper.appendChild(bubble);
  chatArea.appendChild(wrapper);
  autoScroll();
}

function showDotsBubble() {
  const wrapper = document.createElement("div");
  wrapper.className = "message-wrapper hiiro";
  wrapper.id = "dots-temp";
  
  const avatar = document.createElement("div");
  avatar.className = "hiiro-avatar";
  
  const bubble = document.createElement("div");
  bubble.className = "bubble dots-bubble";
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatArea.appendChild(wrapper);
  autoScroll();
}

function removeDotsBubble() {
  const dots = document.getElementById("dots-temp");
  if (dots) dots.remove();
}

function autoScroll() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function lockInput() {
  userInput.disabled = true;
  sendBtn.disabled = true;
}

function unlockInput() {
  userInput.disabled = false;
  sendBtn.disabled = false;
  userInput.focus();
}

// 3. 等比率で文字が綺麗に収まる選択肢ボタンの動的生成
function renderChoiceButtons(buttonsString) {
  // 古い未選択のボタンコンテナがあれば静かに削除
  const oldContainer = document.querySelector(".hiiro-buttons-container");
  if (oldContainer) oldContainer.remove();

  const choices = buttonsString.split(",").map(b => b.trim()).filter(b => b !== "");
  if (choices.length === 0) return;

  const container = document.createElement("div");
  container.className = "hiiro-buttons-container";

  choices.forEach(choiceText => {
    const btn = document.createElement("button");
    btn.className = "hiiro-choice-btn";
    btn.textContent = choiceText;
    
    // ボタンをクリックした瞬間に「交換（応酬）」が成立してデータが飛ぶ
    btn.addEventListener("click", () => {
      container.remove();
      handleInteraction(choiceText, "button");
    });
    
    container.appendChild(btn);
  });

  chatArea.appendChild(container);
  autoScroll();
}

// 4. 通信・データ交換コアロジック
async function handleInteraction(text, inputType = "free") {
  if (!text.trim()) return;
  
  // ユーザーの発話を画面に投影
  appendUserBubble(text);
  userInput.value = "";
  
  // 処理のロックと気配（…）の描画
  lockInput();
  showDotsBubble();
  
  // 15秒のタイムアウト制御
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);
  
  try {
    const response = await fetch(GAS_API_URL, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        userId: userId,
        currentPhase: currentPhase,
        text: text,
        input_type: inputType
      }),
      signal: controller.signal
    });
    
    clearTimeout(timeoutId);
    const data = await response.json();
    
    // 気配の消去とひいろの発話
    removeDotsBubble();
    appendHiiroBubble(data.output);
    
    // 次フェーズの記憶
    currentPhase = data.next;
    localStorage.setItem("hiiro_current_phase", currentPhase);
    
    // 選択肢ボタンの付与（データが存在する場合のみ等比率で生成）
    if (data.buttons && data.buttons.trim() !== "") {
      renderChoiceButtons(data.buttons);
    }
    
  } catch (error) {
    console.error("Interaction Error:", error);
    removeDotsBubble();
    appendHiiroBubble("…");
  } finally {
    unlockInput();
  }
}

// 5. トリガーイベントアタッチ
function handleSendClick() {
  const text = userInput.value.trim();
  if (text) {
    handleInteraction(text, "free");
  }
}

sendBtn.addEventListener("click", handleSendClick);
userInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    handleSendClick();
  }
});

// 6. 初回起動時の挨拶と初期ボタンの設置
window.addEventListener("DOMContentLoaded", () => {
  // 初回アクセス時、タイムラインが空ならひいろから最初の問いを投げかける
  if (chatArea.children.length === 0) {
    appendHiiroBubble("そっか。\n今、どんな感じですか？");
    // 必要に応じて、初期状態の「仕事,恋愛,人間関係,その他,イベント,雑談」等のボタンを配置
    renderChoiceButtons("仕事, 恋愛, 人間関係, イベント, 雑談, その他");
  }
});
</script>

</body>
</html>
