<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: sans-serif;
  background: #f5f5f5;
}

#wrapper {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.bubble {
  background: #fff;
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 10px;
  max-width: 85%;
  word-break: break-word;
}

.user { margin-left: auto; background: #e8e8e8; }
.bot { margin-right: auto; }

#input-area {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ddd;
  background: #fff;
}

#msg {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

#send {
  margin-left: 8px;
  padding: 10px 14px;
  border: none;
  border-radius: 20px;
  background: #444;
  color: #fff;
}

#cta-area {
  display: none;
  padding: 10px;
  flex-direction: column;
  gap: 8px;
}

#cta-area a {
  padding: 10px;
  text-align: center;
  border: 1px solid #ccc;
  border-radius: 20px;
  text-decoration: none;
  color: #333;
  background: #fff;
}
</style>
</head>

<body>

<div id="wrapper">

  <div id="chat">
    <div class="bubble bot">こんにちは。ひいろです。</div>
  </div>

  <div id="cta-area">
    <a href="https://fractalhistyle.wixsite.com/my-site-2" target="_blank">
      全体を見る（LP）
    </a>

    <a href="https://lin.ee/xxxxx" target="_blank">
      ゆるく受け取る（LINE）
    </a>
  </div>

  <div id="input-area">
    <input id="msg" placeholder="入力してください">
    <button id="send" onclick="send()">送信</button>
  </div>

</div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbwaY1GKZm4ef4bWMbIXuahlB-VlHBxN6Ud5zjcB9LP1rguX4FlQxc1Gpvy54WwsWlvapw/exec";

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "bubble " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

function showCTA(invite) {
  const area = document.getElementById("cta-area");

  if (invite === "lp" || invite === "line") {
    area.style.display = "flex";
  } else {
    area.style.display = "none";
  }
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const gap = document.createElement("div");
  gap.className = "bubble bot";
  gap.innerText = "……";
  document.getElementById("chat").appendChild(gap);

  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({
        text: text,
        sessionId: "s_" + Date.now()
      })
    });

    const data = await res.json();

    gap.remove();
    addMessage(data.reply, "bot");

    // ■ ここが連動ポイント
    showCTA(data.invite);

  } catch (e) {
    gap.remove();
    addMessage("……", "bot");
  }
}

</script>

</body>
</html>
