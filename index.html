<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background:#f3f3f3;
}

#wrap{
  display:flex;
  flex-direction:column;
  height:100vh;
}

#chat{
  flex:1;
  overflow:auto;
  padding:18px 14px;
}

.bubble{
  display:inline-block;
  padding:10px 12px;
  margin:8px 0;
  border-radius:14px;
  max-width:78%;
  line-height:1.5;
  font-size:14px;
  background:#fff;
  color:#222;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
}

.user{
  margin-left:auto;
  background:#e9e9e9;
}

.system{
  background:#ffffff;
}

.session-card{
  background:#fff;
  border:1px solid #e5e5e5;
  padding:12px;
  border-radius:14px;
  margin-top:6px;
}

.session-btn{
  margin-top:10px;
  display:inline-block;
  padding:8px 12px;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:13px;
  cursor:pointer;
  text-decoration:none;
}

#input{
  display:flex;
  padding:10px;
  background:#fff;
  border-top:1px solid #e8e8e8;
}

input{
  flex:1;
  padding:10px 12px;
  border:none;
  outline:none;
  font-size:14px;
}

button{
  background:#222;
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:10px;
}
</style>

</head>

<body>

<div id="wrap">

  <div id="chat">
    <div class="bubble system">
      ひいろです。一緒にどんなことお話しますか？
    </div>
  </div>

  <div id="input">
    <input id="msg" placeholder="あなたの声をおいてみる">
    <button onclick="send()">送信</button>
  </div>

</div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbzekm1wcBpXGqBXzib_A32z-vgR2uQqezRydqAPHFoXp_k-3MMT1-9j29OhMnmPW2Yaxg/exec";

function add(text, cls="system"){
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.innerText = text;

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

function addSessionCard(url){
  const wrap = document.createElement("div");
  wrap.className = "bubble system";

  wrap.innerHTML = `
    <div class="session-card">
      <div>その感じ、もう少し一緒に見てみませんか。</div>
      <div style="font-size:12px;opacity:0.7;margin-top:6px;">
        セッションという形で、もう少し深く。
      </div>
      <a class="session-btn" href="${url}" target="_blank">
        セッションへ進む
      </a>
    </div>
  `;

  document.getElementById("chat").appendChild(wrap);
  document.getElementById("chat").scrollTop = 999999;
}

async function send(){

  const input = document.getElementById("msg");
  const text = input.value.trim();
  if(!text) return;

  add(text, "user");
  input.value = "";

  const res = await fetch(GAS_URL,{
    method:"POST",
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  add(data.reply, "system");

  // ■ セッションは「会話の中で出る」
  if(data.exit_type === "session"){
    addSessionCard(data.session_url);
  }
}

</script>

</body>
</html>
