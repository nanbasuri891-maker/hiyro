<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: sans-serif; margin:0; background:#f5f5f5; }
#wrap { display:flex; flex-direction:column; height:100vh; }
#chat { flex:1; overflow:auto; padding:16px; }
.bubble { padding:10px 12px; margin:8px 0; border-radius:10px; max-width:80%; background:#fff; }
.user { margin-left:auto; background:#e6e6e6; }
#input { display:flex; padding:10px; background:#fff; }
input { flex:1; padding:10px; }
button { padding:10px 14px; }

#cta {
  display:flex;
  gap:8px;
  padding:10px;
  background:#fff;
  border-top:1px solid #ddd;
}
.cta-btn {
  flex:1;
  padding:10px;
  text-align:center;
  background:#eee;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>
<div id="wrap">

  <div id="chat">
    <div class="bubble">ひいろです。今日はどんなことお話ししましょう？</div>
  </div>

  <div id="input">
    <input id="msg" placeholder="話してみてください">
    <button onclick="send()">送信</button>
  </div>

  <div id="cta">
    <div class="cta-btn" onclick="go('session')">セッション</div>
    <div class="cta-btn" onclick="go('lp')">LP</div>
    <div class="cta-btn" onclick="go('line')">LINE</div>
  </div>

</div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbwz1vdSXipbtsPsVs0rrNXBACQeFWXN4_NSoewRxpMP6LojSDUS9EGVpoQM2f9Em_SCjw/exec";

function add(text, cls="") {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  add(text, "user");
  input.value = "";

  const res = await fetch(GAS_URL, {
    method:"POST",
    body: JSON.stringify({
      text,
      sessionId: "s_" + Date.now()
    })
  });

  const data = await res.json();
  add(data.reply);
}

function go(type){
  if(type === "session"){
    window.open("https://your-session-link.com");
  }
  if(type === "lp"){
    window.open("https://your-lp-link.com");
  }
  if(type === "line"){
    window.open("https://line.me/");
  }
}

</script>

</body>
</html>
