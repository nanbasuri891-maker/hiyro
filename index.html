<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひいろ</title>
  <style>
    :root {
      --bg-color: #fcfcfc;
      --text-color: #333333;
      --accent-color: #888888;
      --border-color: #eef2f3;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .bubble {
      max-width: 85%;
      line-height: 1.7;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .bubble.system { align-self: flex-start; color: var(--text-color); }
    .bubble.user   { align-self: flex-end; color: var(--accent-color); text-align: right; }
    .options-container { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
    .option-btn {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .option-btn:hover { border-color: var(--accent-color); }
    #input-container {
      padding: 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      background: #ffffff;
    }
    #user-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text-color);
      padding: 4px 0;
    }
    #user-input::placeholder { color: #d0d0d0; }
    #send-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }
    #send-btn:disabled { color: #e0e0e0; cursor: default; }
    .cta-container { margin-top: 8px; }
    .cta-link {
      display: inline-block;
      color: var(--text-color);
      text-decoration: underline;
      font-size: 15px;
    }
  </style>
</head>
<body>
<div id="chat-container">
  <div id="chat-log"></div>
  <div id="input-container">
    <input type="text" id="user-input" placeholder="…" autocomplete="off">
    <button id="send-btn" onclick="handleSend()">➔</button>
  </div>
</div>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbymH7fuEgaBSsRJTAn9kieFPg3OwMurZQrJF-TB2TH7GUlLfxT__N8e1AnT0-gzq1F85w/exec";
  const LP_URL  = "https://fractalhistyle.wixsite.com/my-site-2";
  const GAS_TIMEOUT_MS = 15000;

  const chatLog  = document.getElementById("chat-log");
  const userInput = document.getElementById("user-input");
  const sendBtn  = document.getElementById("send-btn");

  // フェーズ管理
  // 'pre'    : 最初の入力待ち（まだボタンが出ていない）
  // 'select' : ボタンが表示されている（追加入力を受け付けない）
  // 'loop'   : GASとの交換ループ中
  let phase = 'pre';

  // ─── 起動 ───────────────────────────────────────────
  window.onload = () => {
    addBubble("system", "ひいろです。今日はどんなお話しましょう？");
    userInput.focus();
  };

  // ─── バブル追加 ──────────────────────────────────────
  function addBubble(sender, text) {
    const bubble = document.createElement("div");
    bubble.className = `bubble ${sender}`;
    bubble.innerHTML = text;
    chatLog.appendChild(bubble);
    chatLog.scrollTop = chatLog.scrollHeight;
    return bubble;
  }

  // ─── 送信ハンドラ ────────────────────────────────────
  async function handleSend() {
    // 'select' フェーズ中はボタン操作のみ受け付ける
    if (phase === 'select') return;

    const text = userInput.value.trim();
    if (!text) return;

    userInput.value = "";
    lockInput();
    addBubble("user", text);

    if (phase === 'pre') {
      // フェーズを即座に 'select' へ移し、二重起動を防ぐ
      phase = 'select';
      setTimeout(() => showPreHiiroOptions(), 600);
    } else {
      // phase === 'loop'
      await exchangeWithGas(text);
    }
  }

  // ─── 候補ボタン表示 ──────────────────────────────────
  function showPreHiiroOptions() {
    const container = document.createElement("div");
    container.className = "options-container";
    ["仕事", "恋愛", "人間関係", "その他", "イベント", "雑談"].forEach(menu => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = menu;
      btn.onclick = () => selectPreHiiro(menu, container);
      container.appendChild(btn);
    });
    chatLog.appendChild(container);
    chatLog.scrollTop = chatLog.scrollHeight;
    // ボタン選択待ち中は入力欄を封じる（lockInput はすでに呼ばれているが念のため）
    lockInput();
  }

  // ─── ボタン選択 ──────────────────────────────────────
  function selectPreHiiro(choice, container) {
    container.style.display = "none";
    addBubble("user", choice);
    phase = 'loop';
    setTimeout(() => {
      addBubble("system", `そっか<br>${choice}の中で、今ちょっと気になってる感じってありますか`);
      unlockInput();
    }, 600);
  }

  // ─── GAS通信 ────────────────────────────────────────
  async function exchangeWithGas(text) {
    const dotsBubble = addBubble("system", "…");

    const controller = new AbortController();
    const timeoutId  = setTimeout(() => controller.abort(), GAS_TIMEOUT_MS);

    try {
      const response = await fetch(GAS_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ text }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      const data = await response.json();
      dotsBubble.remove();
      addBubble("system", data.output);

      if (data.next === "lp") {
        showCTA();
      } else {
        unlockInput();
      }
    } catch (_) {
      // タイムアウト・通信エラーいずれも "…" でホールド
      clearTimeout(timeoutId);
      dotsBubble.remove();
      addBubble("system", "…");
      unlockInput();
    }
  }

  // ─── CTA表示 ────────────────────────────────────────
  function showCTA() {
    lockInput(); // 終端なので解除しない
    const ctaContainer = document.createElement("div");
    ctaContainer.className = "cta-container";
    const link = document.createElement("a");
    link.className = "cta-link";
    link.href = LP_URL;
    link.target = "_blank";
    link.innerText = "➔ そのまま、一緒に";
    ctaContainer.appendChild(link);
    chatLog.appendChild(ctaContainer);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  // ─── 入力制御ヘルパー ────────────────────────────────
  function lockInput() {
    userInput.disabled = true;
    sendBtn.disabled   = true;
  }
  function unlockInput() {
    userInput.disabled = false;
    sendBtn.disabled   = false;
    userInput.focus();
  }

  // ─── キーボード送信 ──────────────────────────────────
  userInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter" && !userInput.disabled) handleSend();
  });
</script>
</body>
</html>
