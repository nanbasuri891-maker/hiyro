<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひいろ</title>
  <style>
    :root {
      --bg-color: #fcfcfc;
      --text-color: #333333;
      --accent-color: #888888;
      --border-color: #eef2f3;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .bubble {
      max-width: 85%;
      line-height: 1.7;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .bubble.system {
      align-self: flex-start;
      color: var(--text-color);
    }
    .bubble.user {
      align-self: flex-end;
      color: var(--accent-color);
      text-align: right;
    }
    .options-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }
    .option-btn {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .option-btn:hover {
      border-color: var(--accent-color);
    }
    #input-container {
      padding: 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      background: #ffffff;
    }
    #user-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text-color);
      padding: 4px 0;
    }
    #user-input::placeholder { color: #d0d0d0; }
    #send-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }
    #send-btn:disabled { color: #e0e0e0; cursor: default; }
    .cta-container {
      margin-top: 8px;
    }
    .cta-link {
      display: inline-block;
      color: var(--text-color);
      text-decoration: underline;
      font-size: 15px;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-log"></div>
  <div id="input-container">
    <input type="text" id="user-input" placeholder="…" autocomplete="off">
    <button id="send-btn" onclick="handleSend()">➔</button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbymH7fuEgaBSsRJTAn9kieFPg3OwMurZQrJF-TB2TH7GUlLfxT__N8e1AnT0-gzq1F85w/exec"; 
  const LP_URL = "https://fractalhistyle.wixsite.com/my-site-2";

  const chatLog = document.getElementById("chat-log");
  const userInput = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  // 初回入力か、その後の交換ループかを識別するフラグ
  let isFirstInput = true;

  window.onload = () => {
    // 始まりは静かに問いかけるのみ（ボタンは出さない）
    addBubble("system", "ひいろです。今日はどんなお話しましょう？");
    userInput.focus();
  };

  function addBubble(sender, text) {
    const bubble = document.createElement("div");
    bubble.className = `bubble ${sender}`;
    bubble.innerHTML = text; 
    chatLog.appendChild(bubble);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  // メインの送信管理
  async function handleSend() {
    const text = userInput.value.trim();
    if (!text) return;

    userInput.value = "";
    userInput.disabled = true;
    sendBtn.disabled = true;

    addBubble("user", text);

    if (isFirstInput) {
      // 1回目の入力があったので、候補ボタン（プレひいろ層）を展開
      setTimeout(() => {
        showPreHiiroOptions();
      }, 600);
    } else {
      // 2回目以降は、スプシ（GAS）との純粋な交換ループ
      await exchangeWithGas(text);
    }
  }

  // ① ユーザーの最初の一言の「後」にボタンを出す
  function showPreHiiroOptions() {
    const optionsContainer = document.createElement("div");
    optionsContainer.className = "options-container";
    
    const menus = ["仕事", "恋愛", "人間関係", "その他", "イベント", "雑談"];
    menus.forEach(menu => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = menu;
      btn.onclick = () => selectPreHiiro(menu);
      optionsContainer.appendChild(btn);
    });
    
    chatLog.appendChild(optionsContainer);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  // ボタンが選ばれたら、そこから交換ループのフェーズへ移行
  function selectPreHiiro(choice) {
    const containers = document.getElementsByClassName("options-container");
    if(containers.length > 0) containers[containers.length - 1].style.display = "none";
    
    addBubble("user", choice);
    isFirstInput = false; // 初回フラグをオフにする
    
    setTimeout(() => {
      addBubble("system", `そっか<br>${choice}の中で、今ちょっと気になってる感じってありますか`);
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }, 600);
  }

  // ② ひいろ本体（GAS通信）
  async function exchangeWithGas(text) {
    const dotsBubble = document.createElement("div");
    dotsBubble.className = "bubble system";
    dotsBubble.innerText = "…";
    chatLog.appendChild(dotsBubble);
    chatLog.scrollTop = chatLog.scrollHeight;

    try {
      const response = await fetch(GAS_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ text: text })
      });

      const data = await response.json();
      
      dotsBubble.remove();
      addBubble("system", data.output);

      if (data.next === "lp") {
        showCTA();
      } else {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }

    } catch (e) {
      dotsBubble.remove();
      addBubble("system", "…");
      userInput.disabled = false;
      sendBtn.disabled = false;
    }
  }

  function showCTA() {
    userInput.disabled = true;
    sendBtn.disabled = true;

    const ctaContainer = document.createElement("div");
    ctaContainer.className = "cta-container";

    const link = document.createElement("a");
    link.className = "cta-link";
    link.href = LP_URL;
    link.target = "_blank";
    link.innerText = "➔ そのまま、一緒に";

    ctaContainer.appendChild(link);
    chatLog.appendChild(ctaContainer);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  userInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter" && !userInput.disabled) {
      handleSend();
    }
  });
</script>

</body>
</html>
