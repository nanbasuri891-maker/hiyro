<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f3f3f3;
}

#wrap{
  display:flex;
  flex-direction:column;
  height:100vh;
}

#chat{
  flex:1;
  overflow:auto;
  padding:18px 14px;
}

.bubble{
  display:inline-block;
  padding:10px 12px;
  margin:10px 0;
  border-radius:14px;
  max-width:78%;
  line-height:1.6;
  font-size:14px;
  background:#fff;
  color:#222;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
}

.user{
  margin-left:auto;
  background:#e9e9e9;
}

.system{
  background:#fff;
}

.gap{
  height:12px;
}

#input{
  display:flex;
  padding:10px;
  background:#fff;
  border-top:1px solid #e8e8e8;
}

input{
  flex:1;
  padding:10px 12px;
  border:none;
  outline:none;
  font-size:14px;
}

button{
  background:#222;
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:10px;
}
</style>

</head>

<body>

<div id="wrap">

  <div id="chat">
    <div class="bubble system">
      ひいろです。一緒にどんなこと、お話しますか？
    </div>
  </div>

  <div id="input">
    <input id="msg" placeholder="あなたの声をおいてみる">
    <button onclick="send()">送信</button>
  </div>

</div>

<script>

const GAS_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQMkIxWVf_pnfnBrZjo0zvwcAmMF9qFDq1j0D5Xrlz8QQ_GlxQzsB9NJm89KvDXi57puiUe8vUM2g6CwdfNCfzmzIaMm-AtMp6ozEjuYv8ZCJ_binvpwNh88mvnoZmV0EAigPwoV0Bdg1UOLWU-l7oxWXuusr7SCjziKFMOqpQkore00fUnJlxhd6YOi6Svn9kxbXBJoYlF1DlP846kdv_JrmDlrMKTi8NGmxVQlkb9TOCNGBmFtgQHYJB3-s3q3Fm8Ipnm4KS1Lrw6C3s0LcVZ8GbGQA&lib=MMmmfd84qT9DxAMG-8CkK5C0SNqudikxB";

function add(text, cls="system"){

  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.innerText = text;

  chat.appendChild(div);

  // ■ ここが重要（余白を確実に分離）
  requestAnimationFrame(() => {
    const gap = document.createElement("div");
    gap.className = "gap";
    chat.appendChild(gap);

    chat.scrollTop = chat.scrollHeight;
  });
}

async function send(){

  const input = document.getElementById("msg");
  const text = input.value.trim();
  if(!text) return;

  add(text, "user");
  input.value = "";

  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  add(data.reply || "……", "system");

  if(data.question){
    add(data.question, "system");
  }

  if(data.exit_type === "session"){
    add("その感じ、もう少し一緒に見てみませんか。", "system");

    const div = document.createElement("div");
    div.className = "bubble system";
    div.innerText = "セッションへ進む";
    div.onclick = () => window.open(data.session_url);
    document.getElementById("chat").appendChild(div);

    requestAnimationFrame(() => {
      const gap = document.createElement("div");
      gap.className = "gap";
      document.getElementById("chat").appendChild(gap);
    });
  }
}

</script>

</body>
</html>
