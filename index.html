<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>hiiro</title>
</head>

<body>

<div id="chat"></div>

<!-- プレひいろ -->
<div id="pre">
  <p>ひいろです。今日はどんなお話しましょう？</p>

  <button onclick="modeSelect('仕事')">仕事</button>
  <button onclick="modeSelect('恋愛')">恋愛</button>
  <button onclick="modeSelect('人間関係')">人間関係</button>
  <button onclick="modeSelect('その他')">その他</button>
  <button onclick="modeSelect('イベント')">イベント</button>
  <button onclick="modeSelect('雑談')">雑談</button>
</div>

<input id="input" placeholder="話してください">
<button onclick="send()">送信</button>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbw3jTkQWtfnerR9CgiVDENmSwKcW1MBt082dz5s5shgvaTOC7DRwiX8fkzmf83_rdgjyA/exec";
let mode = "";

function modeSelect(m) {
  mode = m;
  document.getElementById("chat").innerHTML += `<div>（${m}で開始）</div>`;
}

async function send() {

  const text = document.getElementById("input").value;

  const res = await fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({ text: text, mode: mode })
  });

  const data = await res.json();

  render(data.output);

  // ■ CTA（LP）
  if (data.next === "lp") {
    render(`<a href="LP_URL" target="_blank">
      少し、そのまま一緒に見てみませんか。セッションという形で。
    </a>`);
  }

}

function render(msg) {
  const div = document.createElement("div");
  div.innerHTML = msg; // 加工なし
  document.getElementById("chat").appendChild(div);
}

</script>

</body>
</html>
