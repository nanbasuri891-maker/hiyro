<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background:#f3f3f3;
}

#wrap{
  display:flex;
  flex-direction:column;
  height:100vh;
}

#chat{
  flex:1;
  overflow:auto;
  padding:18px 14px;
}

.bubble{
  display:inline-block;
  padding:10px 12px;
  margin:8px 0;
  border-radius:14px;
  max-width:78%;
  line-height:1.5;
  font-size:14px;
  background:#fff;
  color:#222;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
}

.user{
  margin-left:auto;
  background:#e9e9e9;
}

.system{
  background:#fff;
}

#input{
  display:flex;
  padding:10px;
  background:#fff;
  border-top:1px solid #e8e8e8;
}

input{
  flex:1;
  padding:10px 12px;
  border:none;
  outline:none;
  font-size:14px;
}

button{
  background:#222;
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:10px;
}
</style>

</head>

<body>

<div id="wrap">

  <div id="chat">
    <div class="bubble system">
      ひいろです。一緒にどんなこと、お話しますか？
    </div>
  </div>

  <div id="input">
    <input id="msg" placeholder="あなたの声をおいてみる">
    <button onclick="send()">送信</button>
  </div>

</div>

<script>

const GAS_URL = "ここにGASのURL";

function add(text, cls="system"){
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.innerText = text;

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

async function send(){

  const input = document.getElementById("msg");
  const text = input.value.trim();
  if(!text) return;

  add(text, "user");
  input.value = "";

  const res = await fetch(GAS_URL, {
    method:"POST",
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  add(data.reply, "system");
}

</script>

</body>
</html>
